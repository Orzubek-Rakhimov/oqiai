# nginx in front of O'qi AI. Coolify's proxy in front of it provides the
# HTTPS that the browser's microphone needs.
#
# It serves the files of public/ itself (the built JavaScript, CSS and
# fonts under /build, and the saved voice clips for Syllable help under
# /storage) and passes every other request to Laravel's front controller
# (public/index.php) in the `oqi-php` service.
#
# It runs as the `nginx` user, so it listens on 8080 and keeps its files
# in /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    # A sentence's recording is well under this; PHP allows the same 8 MB
    # (docker/php/php.ini).
    client_max_body_size 8m;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    proxy_temp_path /tmp/proxy_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Docker's own name service. Looking the `oqi-php` service up through a
    # variable (below) makes nginx ask again every 10 seconds, so it follows
    # a container that a redeploy replaced, where a fixed name would be
    # looked up once at start and then answer 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /var/www/html/public;

        # Referrer-Policy is same-origin, not no-referrer: Laravel's
        # "go back to where you came from" reads the Referer header.
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        # The microphone is allowed for this site itself (the Child reads
        # aloud), and the camera and location for nobody.
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

        # Vite names every built file by its content, so a browser may keep
        # them for good. (add_header here replaces the server's own, so the
        # ones above are repeated.)
        location /build/ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # The voice clips (the public disk, a volume shared with `oqi-php`).
        # A clip keeps its name when it is regenerated after a listen, so the
        # browser asks again each time and gets a quick "not modified".
        location /storage/ {
            access_log off;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri @laravel;
        }

        # Hidden files are never served, nor is PHP source as a download.
        location ~ /\.(?!well-known) {
            return 404;
        }

        location ~ \.php$ {
            return 404;
        }

        # A file of public/ if there is one, else Laravel.
        location / {
            try_files $uri @laravel;
        }

        # The address and scheme the browser really used arrive in the
        # X-Forwarded-* headers of Coolify's proxy and are passed on as they
        # are; Laravel believes them only from the addresses in
        # TRUSTED_PROXIES.
        location @laravel {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_param HTTP_PROXY "";
            fastcgi_hide_header X-Powered-By;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 8 16k;
            fastcgi_busy_buffers_size 64k;
            fastcgi_read_timeout 70s;
            set $php_upstream oqi-php:9000;
            fastcgi_pass $php_upstream;
        }
    }
}
