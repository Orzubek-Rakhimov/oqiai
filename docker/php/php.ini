; PHP settings for production, on top of PHP's own php.ini-production.

expose_php = Off
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
; A sentence's recording is a few hundred KB (the app accepts up to 2 MB);
; nginx allows the same 8 MB (docker/nginx/nginx.conf).
upload_max_filesize = 8M
post_max_size = 8M
session.upload_progress.enabled = Off
; The app works out Tashkent days itself; this is only PHP's own default
; before Laravel starts.
date.timezone = UTC

; Errors go to the logs (which Coolify shows), never into a page.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; The image never changes once built, so files never need re-checking.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
