; PHP-FPM pool settings for the app service.

[www]
listen = 9000

; Up to 10 requests at once; a few workers are kept ready. Each may use up
; to PHP's memory_limit, so raise this together with the service's memory
; limit (APP_MEMORY in compose.production.yaml). A sentence submission
; waits on the speech-to-text service, so a worker can be busy for some
; seconds while a Child reads.
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; A request that hangs is stopped, a little after PHP's own time limit.
request_terminate_timeout = 65s

; Laravel writes its log to stderr (LOG_CHANNEL=stderr); pass it on as it is.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
security.limit_extensions = .php
